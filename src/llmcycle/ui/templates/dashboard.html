<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLMCycle API Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--primary-glow);
        }

        .user-badge {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        
        .user-badge:hover {
            border-color: rgba(239, 68, 68, 0.5);
            color: var(--error);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px var(--primary-glow);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .metric span.value {
            color: var(--text-main);
            font-weight: 600;
        }

        .url {
            font-size: 0.8rem;
            color: var(--primary);
            word-break: break-all;
            background: rgba(99, 102, 241, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 12px;
            display: inline-block;
        }

        .section-title {
            margin: 40px 0 20px 0;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
        }
        
        /* Login Form Styles */
        #login-view {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
            color: white;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        #error-msg {
            color: var(--error);
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

    </style>
</head>
<body>
    <div class="container">
        
        <!-- LOGIN VIEW -->
        <div id="login-view">
            <h1 style="margin-bottom: 30px;">LLMCycle Login</h1>
            <div id="error-msg">Invalid username or password.</div>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Authenticate</button>
            </form>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" style="display: none;">
            <header>
                <h1>LLMCycle ♻️</h1>
                <div class="user-badge" id="logout-btn">Log Out</div>
            </header>

            <h2 class="section-title">Active Providers</h2>
            <div class="grid" id="providers-container">
                <!-- Dynamically populated -->
            </div>

            <h2 class="section-title">Fallback Routing Logic</h2>
            <div class="card" style="max-width: 600px;" id="fallbacks-container">
                <!-- Dynamically populated -->
            </div>
        </div>

    </div>

    <script>
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const logoutBtn = document.getElementById('logout-btn');

        // Check if token exists
        let token = localStorage.getItem('llmcycle_token');
        
        if (token) {
            loadDashboard();
        } else {
            loginView.style.display = 'block';
        }

        // Handle Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('llmcycle_token', data.access_token);
                    token = data.access_token;
                    errorMsg.style.display = 'none';
                    loadDashboard();
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorMsg.style.display = 'block';
            }
        });
        
        // Handle Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('llmcycle_token');
            token = null;
            dashboardView.style.display = 'none';
            loginView.style.display = 'block';
            document.getElementById('password').value = '';
        });

        // Fetch API and Build UI
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    // Token invalid
                    localStorage.removeItem('llmcycle_token');
                    loginView.style.display = 'block';
                    dashboardView.style.display = 'none';
                    return;
                }

                const data = await response.json();
                renderDashboard(data);
                
                loginView.style.display = 'none';
                dashboardView.style.display = 'block';
            } catch (err) {
                console.error('Failed to load dashboard', err);
            }
        }

        function renderDashboard(data) {
            const pContainer = document.getElementById('providers-container');
            const fContainer = document.getElementById('fallbacks-container');
            
            pContainer.innerHTML = '';
            fContainer.innerHTML = '';

            // Providers
            if (data.providers.length === 0) {
                pContainer.innerHTML = `
                    <div class="card" style="grid-column: 1 / -1; text-align: center; border-style: dashed;">
                        <p style="color: var(--text-muted);">No providers detected. Add API keys to your .env file.</p>
                    </div>`;
            } else {
                data.providers.forEach(p => {
                    pContainer.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">${p.name}</h3>
                                <div class="status-dot"></div>
                            </div>
                            <div class="metric">
                                <span>Total Keys:</span>
                                <span class="value">${p.total_keys}</span>
                            </div>
                            <div class="metric">
                                <span>Active Keys:</span>
                                <span class="value">${p.active_keys}</span>
                            </div>
                            <div class="url">${p.base_url}</div>
                        </div>`;
                });
            }

            // Fallbacks
            const fKeys = Object.keys(data.fallbacks);
            if (fKeys.length === 0) {
                fContainer.innerHTML = `<p style="color: var(--text-muted); margin: 0;">No custom fallback routes configured.</p>`;
            } else {
                fKeys.forEach(primary => {
                    const secondaries = data.fallbacks[primary].join(', ');
                    fContainer.innerHTML += `
                        <div class="metric" style="align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; margin-bottom: 12px;">
                            <span style="font-weight: 600; color: #a855f7;">${primary}</span>
                            <span style="color: var(--text-muted); margin: 0 10px;">➜ falls back to ➜</span>
                            <span style="font-weight: 600;">${secondaries}</span>
                        </div>`;
                });
            }
        }
    </script>
</body>
</html>
