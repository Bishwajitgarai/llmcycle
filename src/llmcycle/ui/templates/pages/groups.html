
<!-- ── GROUPS ─────────────────────────────────── -->
<div id="page-groups" class="page">
  <div class="section-hdr">
    <div class="section-title">Dynamic Groups</div>
    <div class="section-count" id="groups-count">0</div>
    <input type="text" id="groups-search" placeholder="🔍 Filter groups..." style="max-width:180px; margin-bottom:0 !important; margin-left: 16px; font-size:0.8rem; padding:6px 12px;" class="search-input" oninput="filterGroups()">
    <div class="section-actions">
      <button class="btn btn-sm btn-primary" onclick="openGroupModal()">+ Add Group</button>
    </div>
  </div>
  <div class="card-wrap" id="groups-container" style="max-height: 520px; overflow-y: auto; padding-right: 12px; display: flex; flex-direction: column; gap: 8px;">
    <div class="loading-row"><div class="spinner"></div> Loading groups...</div>
  </div>
</div>
