<!-- ── ROUTING ────────────────────────────────── -->
    <div id="page-routing" class="page">
      <div class="section-hdr"><div class="section-title">Routing Strategy</div></div>
      <div class="card-wrap">
        <div style="margin-bottom:10px;font-size:0.85rem;color:var(--muted)">Select how requests are routed across providers:</div>
        <div class="strategy-btns" id="strategy-btns">
          <button class="strat-btn" data-v="priority" onclick="setStrategy('priority')">🏆 Priority</button>
          <button class="strat-btn" data-v="round_robin" onclick="setStrategy('round_robin')">🔄 Round Robin</button>
          <button class="strat-btn" data-v="lowest_latency" onclick="setStrategy('lowest_latency')">⚡ Lowest Latency</button>
        </div>
      </div>

      <div class="section-hdr" style="margin-top:24px">
        <div class="section-title">Fallback Routing</div>
        <div class="section-actions">
          <button class="btn btn-sm btn-cyan" onclick="openFallbackModal()">+ Add Rule</button>
        </div>
      </div>
      <div class="card-wrap" id="fallback-container">
        <div class="loading-row"><div class="spinner"></div> Loading routes...</div>
      </div>

      <div class="section-hdr" style="margin-top:24px"><div class="section-title">Latency Tracker</div></div>
      <div class="card-wrap" id="latency-container">
        <div class="loading-row"><div class="spinner"></div> Loading latencies...</div>
      </div>
    </div>
