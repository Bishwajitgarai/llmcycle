<div id="toast"></div>
<script>
// ── STATE ───────────────────────────────────────────────
let TOKEN = localStorage.getItem('llmc_token') || '';
let registry = {};
let dashData = {};
let activeModels = {};
let currentFallbacks = {};
let currentUser = localStorage.getItem('llmc_user') || 'admin';
let AUTO_MODE = localStorage.getItem('llmc_auto') === '1';

// ── AUTH ────────────────────────────────────────────────
document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new URLSearchParams();
  fd.append('username', document.getElementById('un').value);
  fd.append('password', document.getElementById('pw').value);
  const r = await fetch('/api/v1/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: fd });
  if (r.ok) {
    const d = await r.json();
    TOKEN = d.access_token;
    localStorage.setItem('llmc_token', TOKEN);
    localStorage.setItem('llmc_user', document.getElementById('un').value);
    currentUser = document.getElementById('un').value;
    document.getElementById('user-label').textContent = currentUser;
    showApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
};

function logout() {
  localStorage.removeItem('llmc_token');
  TOKEN = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-error').style.display = 'none';
}

async function apiFetch(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { logout(); return null; }
  return r;
}

// ── INIT ────────────────────────────────────────────────
if (TOKEN) showApp();

async function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-label').textContent = currentUser;
  await Promise.all([loadRegistry(), refreshDashboard(), loadConsoleModels(), checkDetectedEnvProviders()]);
  // Wire Auto-mode checkbox
  const autoChk = document.getElementById('c-auto');
  if (autoChk) {
    autoChk.checked = AUTO_MODE;
    autoChk.onchange = () => { AUTO_MODE = autoChk.checked; localStorage.setItem('llmc_auto', AUTO_MODE ? '1' : '0'); };
  }
}

// ── PAGES ────────────────────────────────────────────────
function setActiveNav(name) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.id === `nav-${name}`));
}

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
  if (name === 'routing') loadRouting();
  if (name === 'groups') loadGroups();
  if (name === 'console') loadConsoleModels();
  if (name === 'analytics') loadAnalytics();
}

// ── DASHBOARD ────────────────────────────────────────────

async function refreshDashboard() {
  const [r, sys_r, proxy_r] = await Promise.all([
    apiFetch('/api/v1/dashboard'),
    apiFetch('/api/v1/system'),
    apiFetch('/api/v1/proxy')
  ]);
  if (!r) return;
  dashData = await r.json();
  const sysData = sys_r ? await sys_r.json() : {};
  const proxyData = proxy_r ? await proxy_r.json() : {};

  document.getElementById('s-providers').textContent = dashData.total_providers;
  document.getElementById('s-keys').textContent = dashData.total_active_keys;
  document.getElementById('s-routes').textContent = Object.keys(dashData.fallbacks || {}).length;
  document.getElementById('s-strategy').textContent = (dashData.strategy || 'priority').replace('_',' ').toUpperCase();
  
  if (document.getElementById('s-storage')) {
    document.getElementById('s-storage').textContent = sysData.storage || 'MemoryStorage';
  }

  document.getElementById('providers-count').textContent = dashData.total_providers;

  // Set proxy URL and status text
  const proxyUrl = proxyData.proxy || '';
  const proxyInput = document.getElementById('proxy-url-input');
  const proxyStatus = document.getElementById('proxy-status-message');
  if (proxyInput) proxyInput.value = proxyUrl;
  if (proxyStatus) {
    if (proxyUrl) {
      proxyStatus.innerHTML = `🟢 Egress proxy is <span style="color:var(--cyan); font-weight:600;">ACTIVE</span>: <code>${proxyUrl}</code>`;
    } else {
      proxyStatus.innerHTML = `⚪ Egress proxy is <span style="color:var(--muted); font-weight:600;">DISABLED</span>. Outgoing requests connect directly.`;
    }
  }

  currentFallbacks = dashData.fallbacks || {};
  renderProviders(dashData.providers || []);
  await loadGroups();
}

function renderProviders(providers) {
  const grid = document.getElementById('providers-grid');
  if (!providers.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🏜️</div><div>No providers loaded.</div><div style="font-size:0.8rem;margin-top:8px;color:var(--muted)">Add <code style="color:var(--cyan)">PROVIDER_API_KEYS=...</code> to your .env or click Add Provider</div></div>`;
    return;
  }
  grid.innerHTML = providers.map(p => {
    const { total, active, invalid, rate_limited } = p.keys;
    const badge = active === 0 ? 'badge-error' : (invalid > 0 || rate_limited > 0) ? 'badge-warning' : 'badge-active';
    const badgeTxt = active === 0 ? 'No Active Keys' : `${active}/${total} Active`;
    const keyPills = (p.key_stats || []).map(k => {
      const cls = k.status === 'active' ? 'active' : k.status === 'rate_limited' ? 'rate' : 'invalid';
      return `<div class="key-pill ${cls}">⬤ ${k.hint}</div>`;
    }).join('');
    const latencyStr = p.latency_ms ? `⚡ ${p.latency_ms}ms` : '—';
    return `
    <div class="provider-card">
      <div class="provider-header">
        <div class="provider-name">${p.name}</div>
        <div class="provider-badge ${badge}">${badgeTxt}</div>
      </div>
      <div class="provider-url">${p.base_url}</div>
      <div class="provider-meta">
        <div class="meta-item"><div class="meta-label">Keys</div><div class="meta-value">${total}</div></div>
        <div class="meta-item"><div class="meta-label">Latency</div><div class="meta-value" style="font-size:0.9rem">${latencyStr}</div></div>
      </div>
      <div class="key-pills">${keyPills || '<span style="font-size:0.75rem;color:var(--muted)">No key details</span>'}</div>
      <div class="divider"></div>
      <div class="provider-actions">
        <button class="btn btn-sm btn-ghost" onclick="showModels('${p.name.toLowerCase()}')">📋 Models</button>
        <button class="btn btn-sm btn-ghost" onclick="openKeysModal('${p.name.toLowerCase()}')">🔑 Add Key</button>
        <button class="btn btn-sm btn-ghost" style="margin-left:auto" onclick="useInConsole('${p.name.toLowerCase()}')">▶ Test</button>
      </div>
    </div>`;
  }).join('');
}

// ── REGISTRY ────────────────────────────────────────────
const CATEGORIES = {
  'Frontier / Cloud': ['OPENAI','AZURE','ANTHROPIC','GOOGLE','VERTEXAI','AWS_BEDROCK'],
  'Fast Inference': ['GROQ','TOGETHER','FIREWORKS','ANYSCALE','PERPLEXITY','OPENROUTER','DEEPINFRA','FEATHERLESS','NOVITA','CHUTES','NSCALE','NEBIUS','HYPERBOLIC','LAMBDA','SAMBANOVA','CEREBRAS','FRIENDLIAI','GALADRIEL','GMI','PUBLICAI','COMETAPI','AIML'],
  'Chinese / Asia': ['DEEPSEEK','QWEN','DASHSCOPE','MOONSHOT','MINIMAX','ZHIPU','BAIDU','VOLCANO','XIAOMI','ZAI'],
  'Specialized': ['MISTRAL','CODESTRAL','COHERE','AI21','NLP_CLOUD','ALEPH_ALPHA','PREDIBASE','CLARIFAI','HUGGINGFACE','GRADIENT'],
  'Local / Self-Hosted': ['OLLAMA','LM_STUDIO','VLLM','LLAMAFILE','TRITON','XINFERENCE','DOCKER_MODEL'],
  'Enterprise': ['DATABRICKS','SAGEMAKER','SNOWFLAKE','WATSONX','SAP','OCI','CLOUDFLARE','HEROKU','OVH','SCALEWAY','DATAROBOT','NVIDIA','NVIDIA_NIM'],
  'Dev / Other': ['GITHUB','VERCEL','XAI','BASETEN','REPLICATE','STABILITY','FAL','RECRAFT','RUNWAYML','BLACK_FOREST'],
};

function getCategoryFor(key) {
  for (const [cat, keys] of Object.entries(CATEGORIES)) {
    if (keys.includes(key)) return cat;
  }
  return 'Other';
}

let filteredRegistry = [];
let activeCategory = 'All';

async function loadRegistry() {
  const r = await apiFetch('/api/v1/registry');
  if (!r) return;
  registry = await r.json();
  filteredRegistry = Object.entries(registry);
  document.getElementById('registry-count').textContent = filteredRegistry.length;

  // Build category filters
  const cats = ['All', ...Object.keys(CATEGORIES), 'Other'];
  document.getElementById('cat-filters').innerHTML = cats.map(c =>
    `<button class="cat-btn${c==='All'?' active':''}" onclick="setCat('${c}',this)">${c}</button>`
  ).join('');

  // Populate add-modal select
  const sel = document.getElementById('add-provider-select');
  sel.innerHTML = '<option value="">— Pick from registry or custom —</option>' +
    Object.entries(registry).map(([k,v]) => `<option value="${k}" data-url="${v}">${k} — ${v}</option>`).join('');

  renderRegistry();
}

function setCat(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterRegistry();
}

function filterRegistry() {
  const q = document.getElementById('reg-search').value.toLowerCase();
  filteredRegistry = Object.entries(registry).filter(([k,v]) => {
    const matchCat = activeCategory === 'All' || getCategoryFor(k) === activeCategory;
    const matchQ = !q || k.toLowerCase().includes(q) || v.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  document.getElementById('registry-count').textContent = filteredRegistry.length;
  renderRegistry();
}

function renderRegistry() {
  const loaded = new Set((dashData.providers || []).map(p => p.name));
  const tbody = document.getElementById('registry-tbody');
  tbody.innerHTML = filteredRegistry.map(([k, url]) => {
    const isLoaded = loaded.has(k.toLowerCase());
    return `<tr>
      <td><span style="font-weight:600">${k}</span>${isLoaded ? ' <span class="provider-badge badge-active" style="font-size:0.65rem;padding:1px 6px">loaded</span>' : ''}</td>
      <td><code style="font-family:var(--mono);color:var(--yellow);font-size:0.78rem">${k}_API_KEYS</code></td>
      <td><span class="mono">${url}</span></td>
      <td style="color:var(--muted);font-size:0.78rem">${getCategoryFor(k)}</td>
      <td>
        ${isLoaded
          ? `<button class="btn btn-sm btn-ghost" onclick="showModels('${k.toLowerCase()}')">Models</button>`
          : `<button class="btn btn-sm btn-cyan" onclick="quickAdd('${k}','${url}')">+ Add</button>`
        }
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">No results</td></tr>';
}

function exportRegistry() {
  const blob = new Blob([JSON.stringify(registry, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'llmcycle-registry.json'; a.click();
  toast('Registry exported!', 'success');
}

// ── ROUTING ───────────────────────────────────────────────
async function loadRouting() {
  const r = await apiFetch('/api/v1/router');
  if (!r) return;
  const data = await r.json();
  currentFallbacks = data.fallbacks || {};

  // Strategy
  document.querySelectorAll('.strat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.v === data.strategy);
  });

  // Fallbacks
  const fc = document.getElementById('fallback-container');
  const fkeys = Object.keys(currentFallbacks);
  fc.innerHTML = fkeys.length ? fkeys.map(primary => {
    const tos = currentFallbacks[primary];
    return `<div class="fallback-rule" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
        <span class="fallback-from" style="font-weight:600;">📌 ${primary}</span>
        <span class="fallback-arrow">&rarr;</span>
        <span class="fallback-to" style="color:var(--muted2); font-family:var(--mono); font-size:0.82rem; display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
          ${tos.map(m => `<span style="background:rgba(255,255,255,0.06); padding:2px 8px; border-radius:6px; border:1px solid var(--border);">${m}</span>`).join('<span class="fallback-arrow" style="margin:0 4px;">&rarr;</span>')}
        </span>
      </div>
      <div style="display:flex; gap:6px; margin-left:auto;">
        <button class="btn btn-sm btn-ghost" onclick="editFallback('${primary}', ${JSON.stringify(tos).replace(/"/g, '&quot;')})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="removeFallback('${primary}')">✕</button>
      </div>
    </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:0.85rem">No fallback rules configured. Add one above.</div>`;

  // Latencies
  const latencies = data.latencies || {};
  const lc = document.getElementById('latency-container');
  const lat = Object.entries(latencies);
  lc.innerHTML = lat.length ? lat.sort((a,b) => a[1]-b[1]).map(([p, ms]) => {
    const pct = Math.min(100, (ms / 2000) * 100);
    const color = ms < 300 ? 'var(--green)' : ms < 800 ? 'var(--yellow)' : 'var(--red)';
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:0.85rem">
        <span>${p}</span><span style="color:${color};font-family:var(--mono)">${ms.toFixed(0)}ms</span>
      </div>
      <div class="latency-bar-wrap"><div class="latency-bar" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:0.85rem">No latency data yet. Run some requests via the Test Console.</div>`;
}

async function setStrategy(val) {
  const r = await apiFetch(`/api/v1/router/strategy?strategy=${val}`, { method: 'PUT' });
  if (r && r.ok) {
    document.querySelectorAll('.strat-btn').forEach(b => b.classList.toggle('active', b.dataset.v === val));
    toast(`Strategy set to ${val.replace('_',' ')}`, 'success');
    document.getElementById('s-strategy').textContent = val.replace('_',' ').toUpperCase();
  }
}

function renderFallbackModelsList() {
  const inp = document.getElementById('fb-fallbacks');
  const list = document.getElementById('fb-fallbacks-list');
  const current = inp.value.split(',').map(x => x.trim()).filter(Boolean);
  if (!current.length) {
    list.innerHTML = '<div style="color:var(--muted); font-size:0.8rem; text-align:center; padding:12px;">No fallbacks added yet. Use the select dropdowns above to add.</div>';
    return;
  }
  list.innerHTML = current.map(fb => `
    <div class="selected-item-row">
      <span class="selected-item-label">🛡️ ${fb}</span>
      <button class="selected-item-remove" onclick="removeFallbackModel('${fb}')">✕</button>
    </div>
  `).join('');
}

function removeFallbackModel(fb) {
  const inp = document.getElementById('fb-fallbacks');
  let current = inp.value.split(',').map(x => x.trim()).filter(Boolean);
  current = current.filter(x => x !== fb);
  inp.value = current.join(', ');
  renderFallbackModelsList();
}

function openFallbackModal() {
  document.getElementById('fb-primary').value = '';
  document.getElementById('fb-fallbacks').value = '';
  document.getElementById('fb-primary-model-search').value = '';
  document.getElementById('fb-fallback-model-search').value = '';
  
  // Populate provider selects
  const p1 = document.getElementById('fb-primary-provider');
  const p2 = document.getElementById('fb-fallback-provider');
  
  const optionsHtml = '<option value="">— Select Provider —</option>' + 
    Object.keys(activeModels).map(p => `<option value="${p}">${p.toUpperCase()}</option>`).join('');
    
  p1.innerHTML = optionsHtml;
  p2.innerHTML = optionsHtml;
  
  document.getElementById('fb-primary-model').innerHTML = '<option value="">— Entire Provider —</option>';
  document.getElementById('fb-fallback-model').innerHTML = '<option value="">— Entire Provider —</option>';
  
  renderFallbackModelsList();
  document.getElementById('fallback-modal').classList.add('open');
}

function onFallbackPrimaryProviderChange() {
  const prov = document.getElementById('fb-primary-provider').value;
  const mSel = document.getElementById('fb-primary-model');
  const primaryInput = document.getElementById('fb-primary');
  document.getElementById('fb-primary-model-search').value = '';
  
  if (!prov) {
    mSel.innerHTML = '<option value="">— Entire Provider —</option>';
    primaryInput.value = '';
    return;
  }
  
  const models = activeModels[prov] || [];
  mSel.innerHTML = '<option value="">— Entire Provider —</option>' + 
    models.map(m => `<option value="${prov}/${m}">${m}</option>`).join('');
    
  primaryInput.value = prov;
}

function onFallbackPrimaryModelChange() {
  const mVal = document.getElementById('fb-primary-model').value;
  const prov = document.getElementById('fb-primary-provider').value;
  document.getElementById('fb-primary').value = mVal || prov;
}

function onFallbackProviderChange() {
  const prov = document.getElementById('fb-fallback-provider').value;
  const mSel = document.getElementById('fb-fallback-model');
  document.getElementById('fb-fallback-model-search').value = '';
  
  if (!prov) {
    mSel.innerHTML = '<option value="">— Entire Provider —</option>';
    return;
  }
  
  const models = activeModels[prov] || [];
  mSel.innerHTML = '<option value="">— Entire Provider —</option>' + 
    models.map(m => `<option value="${prov}/${m}">${m}</option>`).join('');
}

function filterFallbackPrimaryModels() {
  const q = document.getElementById('fb-primary-model-search').value.toLowerCase();
  const sel = document.getElementById('fb-primary-model');
  const prov = document.getElementById('fb-primary-provider').value;
  if (!prov) return;
  const models = activeModels[prov] || [];
  const filtered = models.filter(m => m.toLowerCase().includes(q));
  sel.innerHTML = '<option value="">— Entire Provider —</option>' + 
    filtered.map(m => `<option value="${prov}/${m}">${m}</option>`).join('');
  document.getElementById('fb-primary').value = sel.value || prov;
}

function filterFallbackModels() {
  const q = document.getElementById('fb-fallback-model-search').value.toLowerCase();
  const sel = document.getElementById('fb-fallback-model');
  const prov = document.getElementById('fb-fallback-provider').value;
  if (!prov) return;
  const models = activeModels[prov] || [];
  const filtered = models.filter(m => m.toLowerCase().includes(q));
  sel.innerHTML = '<option value="">— Entire Provider —</option>' + 
    filtered.map(m => `<option value="${prov}/${m}">${m}</option>`).join('');
}

function addFallbackFromSelect() {
  const prov = document.getElementById('fb-fallback-provider').value;
  const mVal = document.getElementById('fb-fallback-model').value;
  if (!prov) return;
  
  const valToAdd = mVal || prov;
  const inp = document.getElementById('fb-fallbacks');
  const current = inp.value.split(',').map(x => x.trim()).filter(Boolean);
  
  if (!current.includes(valToAdd)) {
    current.push(valToAdd);
    inp.value = current.join(', ');
    renderFallbackModelsList();
  }
}

async function submitFallback() {
  const primary = document.getElementById('fb-primary').value.trim();
  const fbs = document.getElementById('fb-fallbacks').value.split(',').map(x => x.trim()).filter(Boolean);
  if (!primary || !fbs.length) { toast('Fill in primary and fallbacks', 'error'); return; }
  currentFallbacks[primary] = fbs;
  const r = await apiFetch('/api/v1/router/fallbacks', { method: 'POST', body: JSON.stringify({ fallbacks: currentFallbacks }) });
  if (r && r.ok) { toast('Fallback rule saved!', 'success'); closeModal('fallback-modal'); loadRouting(); }
}

async function removeFallback(primary) {
  delete currentFallbacks[primary];
  const r = await apiFetch('/api/v1/router/fallbacks', { method: 'POST', body: JSON.stringify({ fallbacks: currentFallbacks }) });
  if (r && r.ok) { toast(`Removed fallback for ${primary}`, 'info'); loadRouting(); }
}

function editFallback(primary, fallbacks) {
  openFallbackModal();
  document.getElementById('fb-primary').value = primary;
  const parts = primary.split('/');
  if (parts.length > 0) {
    document.getElementById('fb-primary-provider').value = parts[0];
    onFallbackPrimaryProviderChange();
    if (parts.length > 1) {
      document.getElementById('fb-primary-model').value = primary;
    } else {
      document.getElementById('fb-primary-model').value = '';
    }
  }
  
  document.getElementById('fb-fallbacks').value = fallbacks.join(', ');
  renderFallbackModelsList();
}

// ── CONSOLE ───────────────────────────────────────────────
function clearOutput() {
  document.getElementById('console-output').textContent = '// Ready...\n';
  document.getElementById('output-meta').innerHTML = '';
}

async function loadConsoleModels() {
  const r = await apiFetch('/api/v1/active_models');
  if (!r) return;
  activeModels = await r.json();
  const providerSel = document.getElementById('c-provider');
  const modelSel = document.getElementById('c-model');
  const groupSel = document.getElementById('c-group');

  providerSel.innerHTML = '<option value="">Select provider</option>' +
    Object.keys(activeModels).map(p => `<option value="${p}">${p.toUpperCase()}</option>`).join('');

  if (!Object.keys(activeModels).length) {
    modelSel.innerHTML = '<option value="">No live models available</option>';
    if (groupSel) groupSel.innerHTML = '<option value="">No groups</option>';
    return;
  }

  if (Object.keys(activeModels).length === 1) {
    providerSel.value = Object.keys(activeModels)[0];
    updateModelOptions();
  } else {
    modelSel.innerHTML = '<option value="">Select provider first</option>';
  }

  // Populate groups (optional)
  if (groupSel) {
    try {
      const gr = await apiFetch('/api/v1/groups');
      if (gr) {
        const groups = await gr.json();
        groupSel.innerHTML = '<option value="">— Use model or provider —</option>' + groups.map(g => `<option value="${g.id}">${g.id}</option>`).join('');
      }
    } catch (e) {
      groupSel.innerHTML = '<option value="">No groups</option>';
    }
  }

  // when user picks a specific model, clear any selected group
  modelSel.onchange = () => { if (groupSel) groupSel.value = ''; attemptAutoRun(); };
}

function updateModelOptions() {
  const provider = document.getElementById('c-provider').value;
  const modelSel = document.getElementById('c-model');
  const groupSel = document.getElementById('c-group');
  const searchInp = document.getElementById('c-model-search');
  if (searchInp) searchInp.value = '';
  let entries = [];
  if (provider) {
    const models = activeModels[provider] || [];
    entries = models.map(m => ({ value: `${provider}/${m}`, label: m }));
  } else {
    entries = Object.entries(activeModels).flatMap(([p, models]) =>
      models.map(m => ({ value: `${p}/${m}`, label: `${p}/${m}` }))
    );
  }
  if (!entries.length) {
    modelSel.innerHTML = '<option value="">No live models available</option>';
    return;
  }
  // selecting provider/model clears any chosen group
  if (groupSel) groupSel.value = '';

  modelSel.innerHTML = '<option value="">Select model</option>' +
    entries.map(e => `<option value="${e.value}">${e.label}</option>`).join('');
}

function onConsoleGroupChange() {
  const gid = document.getElementById('c-group').value;
  const providerSel = document.getElementById('c-provider');
  const modelSel = document.getElementById('c-model');
  const searchInp = document.getElementById('c-model-search');
  if (searchInp) searchInp.value = '';
  if (gid) {
    providerSel.disabled = true;
    modelSel.disabled = true;
    if (AUTO_MODE) attemptAutoRun();
  } else {
    providerSel.disabled = false;
    modelSel.disabled = false;
  }
}

function attemptAutoRun() {
  if (!AUTO_MODE) return;
  const group = document.getElementById('c-group') ? document.getElementById('c-group').value.trim() : '';
  const model = group || document.getElementById('c-model').value.trim();
  const prompt = document.getElementById('c-prompt').value.trim();

  }
}

async function testComplete() {
  const group = document.getElementById('c-group') ? document.getElementById('c-group').value.trim() : '';
  const model = group || document.getElementById('c-model').value.trim();
  const prompt = document.getElementById('c-prompt').value.trim();
  if (!model || !prompt) { toast('Enter model and prompt', 'error'); return; }
  document.getElementById('console-output').textContent = '⏳ Completing...\n';
  document.getElementById('output-meta').innerHTML = '';
  const body = {
    model, prompt,
    temperature: parseFloat(document.getElementById('c-temp').value) || 0.7,
    max_tokens: parseInt(document.getElementById('c-tokens').value) || 512,
    max_retries: parseInt(document.getElementById('c-retries').value) || 2,
    retry_delay: parseFloat(document.getElementById('c-delay').value) || 1.0,
  };
  const r = await apiFetch('/api/v1/complete', { method: 'POST', body: JSON.stringify(body) });
  if (!r) return;
  if (r.ok) {
    const d = await r.json();
    document.getElementById('console-output').textContent = d.content;
    document.getElementById('output-meta').innerHTML = `
      <span class="output-tag provider">🏢 ${d.provider}</span>
      <span class="output-tag latency">⚡ ${d.latency_ms}ms</span>
      <span class="output-tag tokens">🔤 ${d.tokens.prompt}→${d.tokens.completion} tokens</span>`;
    toast('Complete!', 'success');
  } else {
    const e = await r.json();
    document.getElementById('console-output').textContent = `❌ Error: ${e.detail}`;
    toast(e.detail, 'error');
  }
}

async function testStream() {
  const group = document.getElementById('c-group') ? document.getElementById('c-group').value.trim() : '';
  const model = group || document.getElementById('c-model').value.trim();
  const prompt = document.getElementById('c-prompt').value.trim();
  if (!model || !prompt) { toast('Enter model and prompt', 'error'); return; }
  const retries = document.getElementById('c-retries').value || 2;
  const delay = document.getElementById('c-delay').value || 1.0;
  const out = document.getElementById('console-output');
  out.textContent = '📡 Streaming...\n';
  document.getElementById('output-meta').innerHTML = '';
  const url = `/api/v1/stream?model=${encodeURIComponent(model)}&prompt=${encodeURIComponent(prompt)}&max_retries=${retries}&retry_delay=${delay}`;
  const resp = await fetch(url, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  out.textContent = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (line.startsWith('data: ')) {
        const chunk = line.slice(6);
        if (chunk === '[DONE]') { toast('Stream complete!', 'success'); break; }
        if (chunk.startsWith('[ERROR]')) { out.textContent += '\n' + chunk; toast(chunk, 'error'); break; }
        out.textContent += chunk;
        out.scrollTop = out.scrollHeight;
      }
    }
  }
}

async function loadAnalytics() {
  const r = await apiFetch('/api/v1/analytics/data');
  if (!r) return;
  const data = await r.json();
  
  const summary = data.summary || { total_requests: 0 };
  const providers = data.by_provider || [];
  const models = data.by_model || [];
  const timeseries = data.timeseries || [];
  const errors = data.top_errors || [];
  
  // 1. Summary Cards
  document.getElementById('an-total-reqs').textContent = summary.total_requests || 0;
  document.getElementById('an-avg-latency').textContent = summary.avg_latency_ms ? `${summary.avg_latency_ms.toFixed(0)}ms` : '—';
  document.getElementById('an-total-tokens').textContent = summary.total_tokens ? summary.total_tokens.toLocaleString() : 0;
  
  const successRate = summary.total_requests ? ((1 - (summary.error_rate || 0)) * 100).toFixed(1) : '100';
  document.getElementById('an-success-rate').textContent = `${successRate}%`;
  
  const fallbackRate = summary.total_requests ? ((summary.fallback_rate || 0) * 100).toFixed(1) : '0';
  document.getElementById('an-fallback-rate').textContent = `${fallbackRate}%`;
  
  document.getElementById('an-min-latency').textContent = summary.min_latency_ms ? `${summary.min_latency_ms.toFixed(0)}ms` : '—';
  document.getElementById('an-max-latency').textContent = summary.max_latency_ms ? `${summary.max_latency_ms.toFixed(0)}ms` : '—';
  
  // 2. Providers Load Graph
  const provContainer = document.getElementById('an-providers-container');
  if (providers.length) {
    const maxReqs = Math.max(...providers.map(p => p.requests));
    provContainer.innerHTML = providers.map(p => {
      const pct = (p.requests / maxReqs) * 100;
      return `<div>
        <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:0.83rem;">
          <span style="font-weight:600; text-transform:uppercase;">🏢 ${p.provider}</span>
          <span style="color:var(--muted2); font-family:var(--mono); font-size:0.78rem;">${p.requests} reqs · avg ${p.avg_latency_ms.toFixed(0)}ms</span>
        </div>
        <div class="latency-bar-wrap"><div class="latency-bar" style="width:${pct}%; background:linear-gradient(90deg, var(--primary), var(--cyan));"></div></div>
      </div>`;
    }).join('');
  } else {
    provContainer.innerHTML = '<div style="color: var(--muted); font-size: 0.85rem;">No provider stats available yet.</div>';
  }
  
  // 3. Models Load Graph
  const modContainer = document.getElementById('an-models-container');
  if (models.length) {
    const maxReqs = Math.max(...models.map(m => m.requests));
    modContainer.innerHTML = models.map(m => {
      const pct = (m.requests / maxReqs) * 100;
      return `<div>
        <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:0.83rem;">
          <span style="font-weight:600; color:var(--cyan); font-family:var(--mono);">${m.model}</span>
          <span style="color:var(--muted2); font-family:var(--mono); font-size:0.78rem;">${m.requests} reqs · avg ${m.avg_latency_ms.toFixed(0)}ms</span>
        </div>
        <div class="latency-bar-wrap"><div class="latency-bar" style="width:${pct}%; background:linear-gradient(90deg, var(--cyan), var(--green));"></div></div>
      </div>`;
    }).join('');
  } else {
    modContainer.innerHTML = '<div style="color: var(--muted); font-size: 0.85rem;">No model stats available yet.</div>';
  }
  
  // 4. Timeline
  const timelineContainer = document.getElementById('an-timeline-container');
  if (timeseries.length) {
    const maxReqs = Math.max(...timeseries.map(t => t.requests));
    timelineContainer.innerHTML = timeseries.map(t => {
      const height = Math.max(15, (t.requests / maxReqs) * 100);
      const timeLabel = t.bucket.split('T')[1] || t.bucket;
      return `<div style="display:flex; flex-direction:column; align-items:center; flex:1; min-width:45px; height:100%; justify-content:flex-end;">
        <div style="color:var(--green); font-size:0.7rem; font-family:var(--mono); font-weight:600; margin-bottom:4px;">${t.requests}</div>
        <div style="width:20px; height:${height}px; background:linear-gradient(180deg, var(--green), var(--primary)); border-radius:3px 3px 0 0;" title="${t.requests} requests, ${t.tokens} tokens"></div>
        <div style="color:var(--muted); font-size:0.65rem; margin-top:6px; font-family:var(--mono);">${timeLabel}</div>
      </div>`;
    }).join('');
  } else {
    timelineContainer.innerHTML = '<div style="width:100%; text-align:center; color:var(--muted); font-size:0.85rem; align-self:center;">No hourly events captured yet.</div>';
  }
  
  // 5. System Error Signatures
  const errContainer = document.getElementById('an-errors-container');
  if (errors.length) {
    errContainer.innerHTML = errors.map(e => `
      <div style="background:rgba(255,59,92,0.04); border:1px solid rgba(255,59,92,0.15); border-radius:10px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <div style="font-family:var(--mono); font-size:0.8rem; color:var(--red); word-break:break-all;">${e.error}</div>
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
          <span class="provider-badge badge-error" style="text-transform:uppercase;">${e.provider}</span>
          <span style="background:var(--red); color:white; font-size:0.75rem; font-weight:700; padding:2px 8px; border-radius:10px;">${e.count}x</span>
        </div>
      </div>
    `).join('');
  } else {
    errContainer.innerHTML = '<div style="color: var(--green); font-size: 0.85rem; font-weight:500;">✓ No errors recorded! System is fully healthy.</div>';
  }
}

// ─── SEARCH & FILTER CONTROLLERS ───────────────────────────────────────────────
function filterOverviewProviders() {
  const q = document.getElementById('overview-search').value.toLowerCase();
  const cards = document.querySelectorAll('#providers-grid .provider-card');
  cards.forEach(card => {
    const name = card.querySelector('.provider-name').textContent.toLowerCase();
    const url = card.querySelector('.provider-url').textContent.toLowerCase();
    const matches = name.includes(q) || url.includes(q);
    card.style.display = matches ? 'block' : 'none';
  });
}

function filterActiveModelsTable() {
  const q = document.getElementById('models-search').value.toLowerCase();
  const rows = document.querySelectorAll('#active-models-tbody tr');
  rows.forEach(row => {
    const cells = row.querySelectorAll('td');
    if (cells.length < 2) return;
    const model = cells[0].textContent.toLowerCase();
    const provider = cells[1].textContent.toLowerCase();
    const caps = cells[4] ? cells[4].textContent.toLowerCase() : '';
    const matches = model.includes(q) || provider.includes(q) || caps.includes(q);
    row.style.display = matches ? '' : 'none';
  });
}

function filterRoutingRules() {
  const q = document.getElementById('routing-search').value.toLowerCase();
  const rules = document.querySelectorAll('#fallback-container .fallback-rule');
  rules.forEach(rule => {
    const fromVal = rule.querySelector('.fallback-from').textContent.toLowerCase();
    const toVal = rule.querySelector('.fallback-to').textContent.toLowerCase();
    const matches = fromVal.includes(q) || toVal.includes(q);
    rule.style.display = matches ? 'flex' : 'none';
  });
}

function filterGroups() {
  const q = document.getElementById('groups-search').value.toLowerCase();
  const rules = document.querySelectorAll('#groups-container .fallback-rule');
  rules.forEach(rule => {
    const fromVal = rule.querySelector('.fallback-from').textContent.toLowerCase();
    const toVal = rule.querySelector('.fallback-to').textContent.toLowerCase();
    const matches = fromVal.includes(q) || toVal.includes(q);
    rule.style.display = matches ? 'flex' : 'none';
  });
}

function filterConsoleModels() {
  const q = document.getElementById('c-model-search').value.toLowerCase();
  const provider = document.getElementById('c-provider').value;
  const modelSel = document.getElementById('c-model');
  
  let entries = [];
  if (provider) {
    const models = activeModels[provider] || [];
    entries = models.map(m => ({ value: `${provider}/${m}`, label: m }));
  } else {
    entries = Object.entries(activeModels).flatMap(([p, models]) =>
      models.map(m => ({ value: `${p}/${m}`, label: `${p}/${m}` }))
    );
  }
  
  const filtered = entries.filter(e => e.value.toLowerCase().includes(q) || e.label.toLowerCase().includes(q));
  
  modelSel.innerHTML = '<option value="">Select model</option>' +
    filtered.map(e => `<option value="${e.value}">${e.label}</option>`).join('');
}

// ─── EGRESS PROXY SETTINGS ─────────────────────────────────────────────────────
async function updateProxySettings() {
  const proxyVal = document.getElementById('proxy-url-input').value.trim();
  if (!proxyVal) {
    toast('Please enter a proxy URL or use Clear', 'error');
    return;
  }
  const r = await apiFetch('/api/v1/proxy', {
    method: 'POST',
    body: JSON.stringify({ proxy: proxyVal })
  });
  if (r && r.ok) {
    toast('Egress proxy saved!', 'success');
    refreshDashboard();
  } else {
    toast('Failed to save proxy', 'error');
  }
}

async function clearProxySettings() {
  const r = await apiFetch('/api/v1/proxy', {
    method: 'POST',
    body: JSON.stringify({ proxy: '' })
  });
  if (r && r.ok) {
    toast('Proxy disabled!', 'info');
    document.getElementById('proxy-url-input').value = '';
    refreshDashboard();
  } else {
    toast('Failed to clear proxy', 'error');
  }
}
</script>
