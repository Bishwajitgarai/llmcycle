<!-- ── LOGIN ─────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">♻️</div>
    <div class="login-title">LLMCycle</div>
    <div class="login-sub">Production LLM Router · Admin Dashboard</div>
    <div id="login-error">Invalid credentials. Try again.</div>
    <form id="login-form">
      <input type="text" id="un" placeholder="Username" required>
      <input type="password" id="pw" placeholder="Password" required>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
  </div>
</div>
