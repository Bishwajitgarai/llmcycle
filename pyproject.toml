[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmcycle"
version = "0.1.3"
description = "Cycle through multiple LLM providers with smart fallback, load balancing, and unified API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "uvicorn>=0.47.0",
]

# ── Storage extras — pick ONE ──────────────────────────────────────────────
# uv add llmcycle[sqlite]    → SQLite (zero config, local dev)
# uv add llmcycle[postgres]  → PostgreSQL
# uv add llmcycle[mysql]     → MySQL / MariaDB
# uv add llmcycle[mssql]     → Microsoft SQL Server
# uv add llmcycle[mongo]     → MongoDB
# uv add llmcycle[redis]     → Redis (best for sessions/cache)
# uv add llmcycle[storage]   → All SQL + Redis + Mongo
[project.optional-dependencies]
sqlite   = ["sqlalchemy>=2.0", "aiosqlite>=0.20"]
postgres = ["sqlalchemy>=2.0", "asyncpg>=0.30"]
mysql    = ["sqlalchemy>=2.0", "aiomysql>=0.2"]
mssql    = ["sqlalchemy>=2.0", "aioodbc>=0.5"]
mongo    = ["motor>=3.3"]
redis    = ["redis>=5.0"]
storage  = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "motor>=3.3",
    "redis>=5.0",
]
all = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "motor>=3.3",
    "redis>=5.0",
]

[project.scripts]
llmcycle = "llmcycle.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.20",       # for storage tests
    "sqlalchemy>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
