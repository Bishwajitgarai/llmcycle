[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmcycle"
version = "0.1.1"
description = "Cycle through multiple LLM providers with smart fallback, load balancing, and unified API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "uvicorn>=0.47.0",
]

[project.scripts]
llmcycle = "llmcycle.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
